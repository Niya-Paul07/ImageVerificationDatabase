<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Verification — Exam Registration Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 2rem;
    }

    .page-wrap { max-width: 680px; margin: 0 auto; }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 44px; height: 44px;
      border-radius: 10px;
      background: #042C53;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon i { color: #B5D4F4; font-size: 20px; }
    .brand-name { font-size: 15px; font-weight: 600; color: #1a1a2e; line-height: 1.3; }
    .brand-sub { font-size: 12px; color: #888; }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 16px; font-weight: 600; color: #1a1a2e;
      margin-bottom: 1.25rem;
      display: flex; align-items: center; gap: 8px;
    }

    .card-title i { color: #185FA5; font-size: 18px; }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }

    .field input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #dde1e7;
      border-radius: 8px;
      font-size: 14px;
      color: #1a1a2e;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: #185FA5;
      box-shadow: 0 0 0 3px rgba(24,95,165,0.1);
      background: #fff;
    }

    .required { color: #a32d2d; margin-left: 2px; }

    /* Capture tabs */
    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 1.25rem;
    }

    .tab-btn {
      flex: 1;
      padding: 9px;
      font-size: 13px;
      font-weight: 500;
      border: 1px solid #dde1e7;
      border-radius: 8px;
      background: #fafafa;
      color: #555;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: #042C53;
      color: #B5D4F4;
      border-color: #042C53;
    }

    /* Webcam */
    .webcam-wrap {
      position: relative;
      background: #1a1a2e;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 4/3;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #webcamVideo {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .webcam-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #aaa;
    }

    .webcam-placeholder i { font-size: 40px; }
    .webcam-placeholder span { font-size: 13px; }

    #canvasEl { display: none; }

    .webcam-controls {
      display: flex;
      gap: 8px;
      margin-top: 0.75rem;
    }

    .cam-btn {
      flex: 1;
      padding: 10px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }

    .cam-btn:hover { opacity: 0.85; }
    .cam-btn.start { background: #185FA5; color: #fff; }
    .cam-btn.capture { background: #042C53; color: #B5D4F4; }
    .cam-btn.retake { background: #f0f4f8; color: #555; border: 1px solid #dde1e7; }
    .cam-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Upload area */
    .photo-upload-area {
      border: 2px dashed #dde1e7;
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .photo-upload-area:hover { border-color: #185FA5; background: #f5f9ff; }

    .photo-upload-area input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
      width: 100%; height: 100%;
    }

    .upload-icon { font-size: 32px; color: #aaa; margin-bottom: 0.5rem; }
    .upload-text { font-size: 14px; color: #555; }
    .upload-hint { font-size: 12px; color: #aaa; margin-top: 4px; }

    .photo-preview {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .photo-preview img {
      width: 120px; height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #185FA5;
    }

    .photo-preview button {
      font-size: 12px; color: #a32d2d;
      background: none; border: none;
      cursor: pointer; text-decoration: underline;
    }

    /* Messages */
    .msg {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 1rem;
    }

    .msg.error { color: #a32d2d; background: #fcebeb; border: 1px solid #f7c1c1; }

    /* Result card */
    .result-card {
      display: none;
      border-radius: 12px;
      padding: 1.5rem;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .result-card.pass {
      background: #EAF3DE;
      border: 2px solid #C0DD97;
    }

    .result-card.fail {
      background: #fcebeb;
      border: 2px solid #f7c1c1;
    }

    .result-icon { font-size: 48px; margin-bottom: 0.5rem; }
    .result-card.pass .result-icon { color: #3B6D11; }
    .result-card.fail .result-icon { color: #a32d2d; }

    .result-label {
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 0.25rem;
    }

    .result-card.pass .result-label { color: #3B6D11; }
    .result-card.fail .result-label { color: #a32d2d; }

    .result-accuracy { font-size: 14px; color: #555; }
    .result-student { font-size: 13px; color: #888; margin-top: 4px; }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background: #042C53;
      color: #B5D4F4;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
    }

    .submit-btn:hover { opacity: 0.88; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #185FA5;
      text-decoration: none;
      margin-bottom: 1.5rem;
    }

    .back-link:hover { text-decoration: underline; }

    .panel { display: none; }
    .panel.active { display: block; }
  </style>
</head>
<body>

<div class="page-wrap">

  <div class="page-header">
    <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <div>
      <div class="brand-name">Exam Registration Platform</div>
      <div class="brand-sub">C-DIT, Trivandrum</div>
    </div>
  </div>

  <a href="/register" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to registration</a>
  <a href="/dashboard" class="back-link" style="margin-left: 1rem;"><i class="fa-solid fa-gauge"></i> Dashboard</a>

  <!-- Result display -->
  <div class="result-card" id="resultCard">
    <div class="result-icon"><i id="resultIcon" class="fa-solid fa-circle-check"></i></div>
    <div class="result-label" id="resultLabel">PASS</div>
    <div class="result-accuracy" id="resultAccuracy">Accuracy: 94.5%</div>
    <div class="result-student" id="resultStudent"></div>
    <div style="display:flex; gap:1.5rem; justify-content:center; margin-top:1rem; flex-wrap:wrap;">
        <div style="text-align:center;">
            <div style="font-size:12px; color:#888; margin-bottom:6px;">Registered photo</div>
            <img id="registeredPhotoEl" src="" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid #185FA5;" />
        </div>
        <div style="text-align:center;">
            <div style="font-size:12px; color:#888; margin-bottom:6px;">Captured photo</div>
            <img id="capturedPhotoEl" src="" style="width:100px; height:100px; border-radius:50%; object-fit:cover; border:3px solid #185FA5;" />
        </div>
    </div>
    
        <div id="nextCandidateWrap" style="display:none; margin-top:1rem;">
            <button onclick="resetForNext()" style="padding:10px 24px; background:#042C53; color:#B5D4F4; border:none; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer;">
                <i class="fa-solid fa-arrow-right"></i> Next candidate
            </button>
        </div>
    </div>


  <!-- Error -->
  <div id="errMsg" class="msg error">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span id="errText">Something went wrong.</span>
  </div>

  <!-- Student ID -->
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-id-card"></i> Student details</div>
    <div class="field">
      <label>Student ID <span class="required">*</span></label>
      <input type="text" id="student_id" placeholder="e.g. S001" />
    </div>
    <div class="field">
      <label>Verified by</label>
      <input type="text" id="verified_by" placeholder="Admin username" value="admin" />
    </div>
  </div>

  <!-- Photo capture -->
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-camera"></i> Capture photo <span class="required">*</span></div>

    <div class="tabs">
      <button class="tab-btn active" id="tabWebcam" onclick="switchTab('webcam')">
        <i class="fa-solid fa-video"></i> Use webcam
      </button>
      <button class="tab-btn" id="tabUpload" onclick="switchTab('upload')">
        <i class="fa-solid fa-upload"></i> Upload photo
      </button>
    </div>

    <!-- Webcam panel -->
    <div class="panel active" id="panelWebcam">
      <div class="webcam-wrap">
        <video id="webcamVideo" autoplay playsinline></video>
        <canvas id="canvasEl"></canvas>
        <div class="webcam-placeholder" id="webcamPlaceholder">
          <i class="fa-solid fa-camera-slash"></i>
          <span>Camera not started</span>
        </div>
        <img id="capturedImg" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:10px;" alt="Captured" />
      </div>
      <div class="webcam-controls">
        <button class="cam-btn start" id="btnStart" onclick="startCamera()">
          <i class="fa-solid fa-video"></i> Start camera
        </button>
        <button class="cam-btn capture" id="btnCapture" onclick="capturePhoto()" disabled>
          <i class="fa-solid fa-camera"></i> Capture
        </button>
        <button class="cam-btn retake" id="btnRetake" onclick="retakePhoto()" style="display:none;">
          <i class="fa-solid fa-rotate-left"></i> Retake
        </button>
      </div>
    </div>

    <!-- Upload panel -->
    <div class="panel" id="panelUpload">
      <div class="photo-upload-area" id="uploadArea">
        <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoSelect(event)" />
        <div id="uploadPlaceholder">
          <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
          <div class="upload-text">Click to upload a photo</div>
          <div class="upload-hint">JPG or JPEG — clear, front-facing, single face only</div>
        </div>
        <div class="photo-preview" id="photoPreview">
          <img id="previewImg" src="" alt="Preview" />
          <span id="previewName"></span>
          <button onclick="clearPhoto(event)">Remove photo</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Submit -->
  <div class="card">
    <button class="submit-btn" id="submitBtn" onclick="handleVerify()">
      <i class="fa-solid fa-face-smile"></i> Verify student
    </button>
  </div>

</div>

<script>
  let stream = null;
  let capturedBlob = null;
  let activeTab = 'webcam';

  function switchTab(tab) {
    activeTab = tab;
    document.getElementById('panelWebcam').classList.toggle('active', tab === 'webcam');
    document.getElementById('panelUpload').classList.toggle('active', tab === 'upload');
    document.getElementById('tabWebcam').classList.toggle('active', tab === 'webcam');
    document.getElementById('tabUpload').classList.toggle('active', tab === 'upload');
    if (tab === 'upload' && stream) stopCamera();
  }

  async function startCamera() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true });
      const video = document.getElementById('webcamVideo');
      video.srcObject = stream;
      video.style.display = 'block';
      document.getElementById('webcamPlaceholder').style.display = 'none';
      document.getElementById('btnCapture').disabled = false;
      document.getElementById('btnStart').style.display = 'none';
    } catch (err) {
      alert('Could not access camera. Please allow camera permissions or use photo upload instead.');
    }
  }

  function capturePhoto() {
    const video = document.getElementById('webcamVideo');
    const canvas = document.getElementById('canvasEl');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);

    canvas.toBlob(blob => {
      capturedBlob = blob;
      const url = URL.createObjectURL(blob);
      const img = document.getElementById('capturedImg');
      img.src = url;
      img.style.display = 'block';
      video.style.display = 'none';
      document.getElementById('btnCapture').style.display = 'none';
      document.getElementById('btnRetake').style.display = 'flex';
      stopCamera();
    }, 'image/jpeg');
  }

  function retakePhoto() {
    capturedBlob = null;
    document.getElementById('capturedImg').style.display = 'none';
    document.getElementById('btnCapture').style.display = 'flex';
    document.getElementById('btnRetake').style.display = 'none';
    document.getElementById('btnStart').style.display = 'flex';
    document.getElementById('btnCapture').disabled = true;
  }

  function stopCamera() {
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  }

  function handlePhotoSelect(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('previewImg').src = ev.target.result;
      document.getElementById('previewName').textContent = file.name;
      document.getElementById('uploadPlaceholder').style.display = 'none';
      document.getElementById('photoPreview').style.display = 'flex';
    };
    reader.readAsDataURL(file);
  }

  function clearPhoto(e) {
    e.stopPropagation();
    document.getElementById('photoInput').value = '';
    document.getElementById('uploadPlaceholder').style.display = 'block';
    document.getElementById('photoPreview').style.display = 'none';
  }
  
  function resetForNext() {
    document.getElementById('resultCard').style.display = 'none';
    document.getElementById('nextCandidateWrap').style.display = 'none';
    document.getElementById('student_id').value = '';
    capturedBlob = null;
    document.getElementById('capturedImg').style.display = 'none';
    document.getElementById('btnCapture').style.display = 'flex';
    document.getElementById('btnRetake').style.display = 'none';
    document.getElementById('btnStart').style.display = 'flex';
    document.getElementById('btnCapture').disabled = true;
    clearPhoto({ stopPropagation: () => {} });
}


  async function handleVerify() {
    const errMsg = document.getElementById('errMsg');
    const errText = document.getElementById('errText');
    const resultCard = document.getElementById('resultCard');
    const btn = document.getElementById('submitBtn');

    errMsg.style.display = 'none';
    resultCard.style.display = 'none';

    const student_id = document.getElementById('student_id').value.trim();
    const verified_by = document.getElementById('verified_by').value.trim();

    if (!student_id) {
      errText.textContent = 'Please enter a student ID.';
      errMsg.style.display = 'flex';
      return;
    }

    let photoBlob = null;

    if (activeTab === 'webcam') {
      if (!capturedBlob) {
        errText.textContent = 'Please capture a photo using the webcam.';
        errMsg.style.display = 'flex';
        return;
      }
      photoBlob = capturedBlob;
    } else {
      const file = document.getElementById('photoInput').files[0];
      if (!file) {
        errText.textContent = 'Please upload a photo.';
        errMsg.style.display = 'flex';
        return;
      }
      photoBlob = file;
    }

    const formData = new FormData();
    formData.append('student_id', student_id);
    formData.append('verified_by', verified_by);
    formData.append('photo', photoBlob, 'capture.jpg');

    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Verifying…';
    btn.disabled = true;

    try {
      const res = await fetch('/verify', {
        method: 'POST',
        body: formData,
        credentials: 'include'
      });
      const data = await res.json();

      if (data.result) {
        const isPass = data.result === 'PASS';
        resultCard.className = 'result-card ' + (isPass ? 'pass' : 'fail');
        document.getElementById('resultIcon').className = isPass
          ? 'fa-solid fa-circle-check'
          : 'fa-solid fa-circle-xmark';
        document.getElementById('resultLabel').textContent = data.result;
        document.getElementById('resultAccuracy').textContent = `Accuracy: ${data.accuracy_percentage}%`;
        document.getElementById('resultStudent').textContent = `Student ID: ${data.student_id}`;
        document.getElementById('registeredPhotoEl').src = 'data:image/jpeg;base64,' + data.registered_photo;
        document.getElementById('capturedPhotoEl').src = 'data:image/jpeg;base64,' + data.captured_photo;
        resultCard.style.display = 'block';
        if (isPass) {
    document.getElementById('nextCandidateWrap').style.display = 'block';
}
        resultCard.scrollIntoView({ behavior: 'smooth' });

        if (!isPass) {
          setTimeout(() => {
            resultCard.style.display = 'none';
            document.getElementById('student_id').value = '';
            capturedBlob = null;
            document.getElementById('capturedImg').style.display = 'none';
            document.getElementById('btnCapture').style.display = 'flex';
            document.getElementById('btnRetake').style.display = 'none';
            document.getElementById('btnStart').style.display = 'flex';
            document.getElementById('btnCapture').disabled = true;
            clearPhoto({ stopPropagation: () => {} });
          }, 5000);
        }
      } else {
        errText.textContent = data.error || 'Verification failed.';
        errMsg.style.display = 'flex';
      }
    } catch {
      errText.textContent = 'Could not connect to server. Is Flask running?';
      errMsg.style.display = 'flex';
    }

    btn.innerHTML = '<i class="fa-solid fa-face-smile"></i> Verify student';
    btn.disabled = false;
  }
</script>

</body>
</html>
