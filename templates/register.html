<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Registration — Exam Registration Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 2rem;
    }

    .page-wrap {
      max-width: 680px;
      margin: 0 auto;
    }

    .page-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #042C53;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .brand-icon i { color: #B5D4F4; font-size: 20px; }
    .brand-name { font-size: 15px; font-weight: 600; color: #1a1a2e; line-height: 1.3; }
    .brand-sub { font-size: 12px; color: #888; }

    .card {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2rem;
      margin-bottom: 1.5rem;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title i { color: #185FA5; font-size: 18px; }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .field { margin-bottom: 1rem; }
    .field:last-child { margin-bottom: 0; }
    .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }

    .field input, .field select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #dde1e7;
      border-radius: 8px;
      font-size: 14px;
      color: #1a1a2e;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
      font-family: 'Segoe UI', sans-serif;
    }

    .field input:focus, .field select:focus {
      border-color: #185FA5;
      box-shadow: 0 0 0 3px rgba(24,95,165,0.1);
      background: #fff;
    }

    .required { color: #a32d2d; margin-left: 2px; }

    /* Photo upload */
    .photo-upload-area {
      border: 2px dashed #dde1e7;
      border-radius: 10px;
      padding: 2rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    .photo-upload-area:hover {
      border-color: #185FA5;
      background: #f5f9ff;
    }

    .photo-upload-area input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 32px; color: #aaa; margin-bottom: 0.5rem; }
    .upload-text { font-size: 14px; color: #555; }
    .upload-hint { font-size: 12px; color: #aaa; margin-top: 4px; }

    .photo-preview {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.75rem;
    }

    .photo-preview img {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #185FA5;
    }

    .photo-preview span { font-size: 13px; color: #555; }
    .photo-preview button {
      font-size: 12px;
      color: #a32d2d;
      background: none;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }

    /* Messages */
    .msg {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 1rem;
    }

    .msg.error { color: #a32d2d; background: #fcebeb; border: 1px solid #f7c1c1; }
    .msg.success { color: #3B6D11; background: #EAF3DE; border: 1px solid #C0DD97; }

    /* Submit button */
    .submit-btn {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      font-weight: 600;
      background: #042C53;
      color: #B5D4F4;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
    }

    .submit-btn:hover { opacity: 0.88; }
    .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #185FA5;
      text-decoration: none;
      margin-bottom: 1.5rem;
    }

    .back-link:hover { text-decoration: underline; }

    @media (max-width: 540px) {
      .grid-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="page-wrap">

  <div class="page-header">
    <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <div>
      <div class="brand-name">Exam Registration Platform</div>
      <div class="brand-sub">C-DIT, Trivandrum</div>
    </div>
  </div>

  <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
  <a href="/verify-page" class="back-link" style="margin-left: 1rem;"><i class="fa-solid fa-arrow-right"></i> Go to verification</a>


  <div id="errMsg" class="msg error">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span id="errText">Something went wrong.</span>
  </div>

  <div id="successMsg" class="msg success">
    <i class="fa-solid fa-circle-check"></i>
    <span id="successText">Student registered successfully!</span>
  </div>

  <!-- Personal Details -->
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-user"></i> Personal details</div>
    <div class="grid-2">
      <div class="field">
        <label>Student ID <span class="required">*</span></label>
        <input type="text" id="student_id" placeholder="e.g. S001" />
      </div>
      <div class="field">
        <label>Full name <span class="required">*</span></label>
        <input type="text" id="full_name" placeholder="Enter full name" />
      </div>
      <div class="field">
        <label>Date of birth <span class="required">*</span></label>
        <input type="date" id="dob" />
      </div>
      <div class="field">
        <label>Department</label>
        <select id="department">
          <option value="">Select department</option>
          <option>Computer Science</option>
          <option>Electronics</option>
          <option>Mechanical</option>
          <option>Civil</option>
          <option>Electrical</option>
          <option>Information Technology</option>
        </select>
      </div>
      <div class="field">
        <label>Email</label>
        <input type="email" id="email" placeholder="student@email.com" />
      </div>
      <div class="field">
        <label>Phone</label>
        <input type="tel" id="phone" placeholder="10-digit number" />
      </div>
    </div>
  </div>

  <!-- Photo Upload -->
  <div class="card">
    <div class="card-title"><i class="fa-solid fa-camera"></i> Photo <span class="required">*</span></div>

    <div class="photo-upload-area" id="uploadArea">
      <input type="file" id="photoInput" accept="image/*" onchange="handlePhotoSelect(event)" />
      <div id="uploadPlaceholder">
        <div class="upload-icon"><i class="fa-solid fa-cloud-arrow-up"></i></div>
        <div class="upload-text">Click to upload a photo</div>
        <div class="upload-hint">JPG or JPEG — clear, front-facing, single face only</div>
      </div>
      <div class="photo-preview" id="photoPreview">
        <img id="previewImg" src="" alt="Preview" />
        <span id="previewName"></span>
        <button onclick="clearPhoto(event)">Remove photo</button>
      </div>
    </div>
  </div>

  <!-- Submit -->
  <div class="card">
    <button class="submit-btn" id="submitBtn" onclick="handleRegister()">
      <i class="fa-solid fa-user-plus"></i> Register student
    </button>
  </div>

</div>

<script>
  function handlePhotoSelect(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('previewImg').src = ev.target.result;
      document.getElementById('previewName').textContent = file.name;
      document.getElementById('uploadPlaceholder').style.display = 'none';
      document.getElementById('photoPreview').style.display = 'flex';
    };
    reader.readAsDataURL(file);
  }

  function clearPhoto(e) {
    e.stopPropagation();
    document.getElementById('photoInput').value = '';
    document.getElementById('previewImg').src = '';
    document.getElementById('uploadPlaceholder').style.display = 'block';
    document.getElementById('photoPreview').style.display = 'none';
  }

  async function handleRegister() {
    const errMsg = document.getElementById('errMsg');
    const errText = document.getElementById('errText');
    const successMsg = document.getElementById('successMsg');
    const successText = document.getElementById('successText');
    const btn = document.getElementById('submitBtn');

    errMsg.style.display = 'none';
    successMsg.style.display = 'none';

    const student_id = document.getElementById('student_id').value.trim();
    const full_name = document.getElementById('full_name').value.trim();
    const dob = document.getElementById('dob').value;
    const photo = document.getElementById('photoInput').files[0];

    if (!student_id || !full_name || !dob || !photo) {
      errText.textContent = 'Please fill in all required fields and upload a photo.';
      errMsg.style.display = 'flex';
      return;
    }

    const formData = new FormData();
    formData.append('student_id', student_id);
    formData.append('full_name', full_name);
    formData.append('dob', dob);
    formData.append('department', document.getElementById('department').value);
    formData.append('email', document.getElementById('email').value.trim());
    formData.append('phone', document.getElementById('phone').value.trim());
    formData.append('photo', photo);

    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Registering…';
    btn.disabled = true;

    try {
      const res = await fetch('/student/register', {
        method: 'POST',
        body: formData,
        credentials: 'include'
      });
      const data = await res.json();

      if (data.message) {
        successText.textContent = `${full_name} registered successfully!`;
        successMsg.style.display = 'flex';
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Registered!';
        document.getElementById('student_id').value = '';
        document.getElementById('full_name').value = '';
        document.getElementById('dob').value = '';
        document.getElementById('department').value = '';
        document.getElementById('email').value = '';
        document.getElementById('phone').value = '';
        clearPhoto({ stopPropagation: () => {} });
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Register student';
      } else {
        errText.textContent = data.error || 'Registration failed.';
        errMsg.style.display = 'flex';
        btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Register student';
        btn.disabled = false;
      }
    } catch {
      errText.textContent = 'Could not connect to server. Is Flask running?';
      errMsg.style.display = 'flex';
      btn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Register student';
      btn.disabled = false;
    }
  }
</script>

</body>
</html>
