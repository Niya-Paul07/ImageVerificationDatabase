<!DOCTYPE html>
<html lang="en">
<head>
  <script>
  history.pushState(null, null, location.href);
  window.onpopstate = function() {
    history.pushState(null, null, location.href);
  };
</script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — Exam Registration Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; min-height: 100vh; }

    .sidebar {
      position: fixed; top: 0; left: 0; width: 220px; height: 100vh;
      background: #042C53; display: flex; flex-direction: column; padding: 1.5rem 1rem; z-index: 100;
    }
    .sidebar-brand { display: flex; align-items: center; gap: 10px; margin-bottom: 2rem;
      padding-bottom: 1.5rem; border-bottom: 1px solid rgba(181,212,244,0.15); }
    .sidebar-brand i { font-size: 22px; color: #B5D4F4; }
    .sidebar-brand-text { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.4; }
    .sidebar-brand-sub { font-size: 11px; color: rgba(181,212,244,0.6); }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 8px; color: rgba(181,212,244,0.7); text-decoration: none;
      font-size: 13px; font-weight: 500; margin-bottom: 4px; transition: all 0.15s; }
    .nav-item:hover { background: rgba(181,212,244,0.1); color: #fff; }
    .nav-item.active { background: rgba(181,212,244,0.15); color: #fff; }
    .nav-item i { font-size: 16px; width: 18px; }
    .sidebar-spacer { flex: 1; }
    .logout-btn { display: flex; align-items: center; gap: 10px; padding: 10px 12px;
      border-radius: 8px; color: rgba(181,212,244,0.7); font-size: 13px; font-weight: 500;
      cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all 0.15s; }
    .logout-btn:hover { background: rgba(220,80,80,0.15); color: #f09595; }

    .main { margin-left: 220px; padding: 2rem; min-height: 100vh; }
    .page-title { font-size: 22px; font-weight: 600; color: #1a1a2e; margin-bottom: 0.25rem; }
    .page-sub { font-size: 13px; color: #888; margin-bottom: 2rem; }

    .card { background: #fff; border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 1.5rem; margin-bottom: 1.5rem; }
    .card-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.25rem; }
    .card-title { font-size: 15px; font-weight: 600; color: #1a1a2e; display: flex; align-items: center; gap: 8px; }
    .card-title i { color: #185FA5; }

    .search-wrap { position: relative; max-width: 280px; }
    .search-wrap i { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #aaa; font-size: 14px; }
    .search-wrap input { padding: 8px 12px 8px 32px; border: 1px solid #dde1e7; border-radius: 8px;
      font-size: 13px; width: 100%; outline: none; background: #fafafa; }
    .search-wrap input:focus { border-color: #185FA5; background: #fff; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; color: #888; font-weight: 500; border-bottom: 1px solid #f0f0f0; }
    td { padding: 12px; color: #1a1a2e; border-bottom: 1px solid #f8f8f8; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafcff; }

    .student-photo { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 2px solid #dde1e7; }
    .empty-state { text-align: center; padding: 2rem; color: #aaa; font-size: 13px; }
    .empty-state i { font-size: 32px; display: block; margin-bottom: 0.5rem; }
    .loading { color: #aaa; font-size: 13px; text-align: center; padding: 1rem; }
  </style>

<script>
  window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
      // Page was loaded from cache (back/forward navigation)
      fetch('/api/check-session', { credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          if (!data.logged_in) {
            window.location.href = '/';
          }
        })
        .catch(() => { window.location.href = '/'; });
    }
  });
</script>

</head>
<body>

<div class="sidebar">
  <div class="sidebar-brand">
    <i class="fa-solid fa-shield-halved"></i>
    <div>
      <div class="sidebar-brand-text">Exam Registration</div>
      <div class="sidebar-brand-sub">C-DIT, Trivandrum</div>
    </div>
  </div>
  <a href="/dashboard" class="nav-item"><i class="fa-solid fa-gauge"></i> Dashboard</a>
  <a href="/verify-page" class="nav-item"><i class="fa-solid fa-face-smile"></i> Verify student</a>
  <a href="/reports" class="nav-item active"><i class="fa-solid fa-chart-bar"></i> Reports</a>
  <div class="sidebar-spacer"></div>
  <button class="logout-btn" onclick="handleLogout()">
    <i class="fa-solid fa-right-from-bracket"></i> Logout
  </button>
</div>

<div class="main">
  <div class="page-title">Reports</div>
  <div class="page-sub">Registered students</div>

  <div class="card">
    <div class="card-header">
      <div class="card-title"><i class="fa-solid fa-users"></i> Registered students</div>
      <div class="search-wrap">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="studentSearch" placeholder="Search by name or ID…" oninput="filterStudents()" />
      </div>
    </div>
    <div id="studentTableWrap">
      <div class="loading"><i class="fa-solid fa-spinner fa-spin"></i> Loading…</div>
    </div>
  </div>
</div>

<script>
  let allStudents = [];

  async function loadReports() {
    try {
      const res = await fetch('/api/dashboard', { credentials: 'include' });
      const data = await res.json();
      if (data.error) { window.location.href = '/'; return; }
      allStudents = data.students;
      renderStudentTable(allStudents);
    } catch {
      document.getElementById('studentTableWrap').innerHTML = '<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i>Could not load data.</div>';
    }
  }

  function renderStudentTable(students) {
    const wrap = document.getElementById('studentTableWrap');
    if (students.length === 0) {
      wrap.innerHTML = '<div class="empty-state"><i class="fa-solid fa-users-slash"></i>No students registered yet.</div>';
      return;
    }
    wrap.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>Photo</th>
            <th>Student ID</th>
            <th>Full name</th>
            <th>Department</th>
            <th>Email</th>
            <th>Registered</th>
          </tr>
        </thead>
        <tbody>
          ${students.map(s => `
            <tr>
              <td><img class="student-photo" src="/student/photo/${s.student_id}" alt="${s.full_name}" onerror="this.src=''" /></td>
              <td><strong>${s.student_id}</strong></td>
              <td>${s.full_name}</td>
              <td>${s.department || '—'}</td>
              <td>${s.email || '—'}</td>
              <td>${s.registered_at ? s.registered_at.split('.')[0] : '—'}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;
  }

  function filterStudents() {
    const q = document.getElementById('studentSearch').value.toLowerCase();
    const filtered = allStudents.filter(s =>
      s.student_id.toLowerCase().includes(q) ||
      s.full_name.toLowerCase().includes(q) ||
      (s.department || '').toLowerCase().includes(q)
    );
    renderStudentTable(filtered);
  }

  async function handleLogout() {
    await fetch('/admin/logout', { method: 'POST', credentials: 'include' });
    window.location.href = '/';
  }

  loadReports();
</script>

</body>
</html>
