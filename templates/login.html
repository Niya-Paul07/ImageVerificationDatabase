<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Exam Registration Platform</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .login-card {
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 420px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 2rem;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      border-radius: 10px;
      background: #042C53;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon i { color: #B5D4F4; font-size: 20px; }

    .brand-name { font-size: 15px; font-weight: 600; color: #1a1a2e; line-height: 1.3; }
    .brand-sub { font-size: 12px; color: #888; }

    h2 { font-size: 22px; font-weight: 600; color: #1a1a2e; margin-bottom: 0.25rem; }
    .subtitle { font-size: 13px; color: #888; margin-bottom: 1.75rem; }

    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; font-weight: 500; }

    .field input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid #dde1e7;
      border-radius: 8px;
      font-size: 14px;
      color: #1a1a2e;
      background: #fafafa;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .field input:focus {
      border-color: #185FA5;
      box-shadow: 0 0 0 3px rgba(24,95,165,0.1);
      background: #fff;
    }

    .error-msg {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #a32d2d;
      background: #fcebeb;
      border: 1px solid #f7c1c1;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 1rem;
    }

    .login-btn {
      width: 100%;
      padding: 11px;
      margin-top: 0.5rem;
      font-size: 15px;
      font-weight: 600;
      background: #042C53;
      color: #B5D4F4;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s;
    }

    .login-btn:hover { opacity: 0.88; }
    .login-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #aaa;
      margin-top: 1.5rem;
    }

    .success-msg {
      display: none;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #3B6D11;
      background: #EAF3DE;
      border: 1px solid #C0DD97;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="brand">
    <div class="brand-icon"><i class="fa-solid fa-shield-halved"></i></div>
    <div>
      <div class="brand-name">Exam Registration Platform</div>
      <div class="brand-sub">C-DIT, Trivandrum</div>
    </div>
  </div>

  <h2>Admin login</h2>
  <p class="subtitle">Sign in to manage student registrations and verifications</p>

  <div class="error-msg" id="errMsg">
    <i class="fa-solid fa-circle-exclamation"></i>
    <span id="errText">Invalid username or password.</span>
  </div>

  <div class="success-msg" id="successMsg">
    <i class="fa-solid fa-circle-check"></i>
    <span>Login successful! Redirecting...</span>
  </div>

  <div class="field">
    <label for="username">Username</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="username" />
  </div>

  <div class="field">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="Enter password" autocomplete="current-password" />
  </div>

  <button class="login-btn" id="loginBtn" onclick="handleLogin()">
    <i class="fa-solid fa-right-to-bracket"></i> Sign in
  </button>

  <p class="footer-note">Access restricted to authorised personnel only</p>
</div>

<script>
  async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const errMsg = document.getElementById('errMsg');
    const errText = document.getElementById('errText');
    const successMsg = document.getElementById('successMsg');
    const btn = document.getElementById('loginBtn');

    errMsg.style.display = 'none';
    successMsg.style.display = 'none';

    if (!username || !password) {
      errText.textContent = 'Please enter both username and password.';
      errMsg.style.display = 'flex';
      return;
    }

    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in…';
    btn.disabled = true;

    try {
      const res = await fetch('http://127.0.0.1:5000/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
        credentials: 'include'
      });
      const data = await res.json();

      if (data.message) {
        successMsg.style.display = 'flex';
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Logged in!';
        setTimeout(() => { window.location.href = '/register'; }, 1500);
      } else {
        errText.textContent = data.error || 'Login failed.';
        errMsg.style.display = 'flex';
        btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign in';
        btn.disabled = false;
      }
    } catch {
      errText.textContent = 'Could not connect to server. Is Flask running?';
      errMsg.style.display = 'flex';
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign in';
      btn.disabled = false;
    }
  }

  document.getElementById('password').addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>

</body>
</html>
